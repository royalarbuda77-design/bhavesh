# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=true

kotlin.code.style=official

# Optional: enable the Picovoice Porcupine wake-word engine source set
# (see docs/WAKE_WORD.md). Requires a Picovoice AccessKey in
# local.properties as  jarvis.porcupine.key=...
jarvis.engines.porcupine=false
