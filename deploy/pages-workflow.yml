name: Deploy Nexus AI Lite to GitHub Pages

on:
  push:
    branches: [main, arena/01a02a37-bhavesh]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Enable GitHub Pages (workflow build) if not enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Trying to create the Pages site with workflow build type…"
          gh api "repos/${{ github.repository }}/pages" -X POST \
            -f build_type=workflow 2>/dev/null \
          || gh api "repos/${{ github.repository }}/pages" -X PUT \
            -f build_type=workflow 2>/dev/null \
          || echo "::warning::Could not auto-enable Pages — enable it in Settings → Pages (Source: GitHub Actions), then re-run this workflow."

      - uses: actions/configure-pages@v5

      - name: Upload Lite app (docs/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
